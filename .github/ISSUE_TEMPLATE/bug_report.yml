name: Bug report
description: Something in Quire doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, please use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new document
        2. Paste a screenshot into the first cell
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quire version
      description: Help > About Quire
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - High contrast
        - Not relevant
  - type: textarea
    id: extra
    attributes:
      label: Files, screenshots or logs
      description: A small .quire file that shows the problem is the most useful thing you can attach. Remove anything private first.

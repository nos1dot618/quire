name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit checks
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  build-and-test:
    name: Build and test
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Quire.slnx

      - name: Build
        run: dotnet build Quire.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Quire.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      # Catches publish-only problems (single-file packaging, trimming of native WPF libraries) before a release does.
      - name: Publish smoke test
        run: dotnet publish src/Quire.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-check

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Quire-win-x64-${{ github.sha }}
          path: publish-check/
          retention-days: 7
